  <div id="root">
    
  </div>

<script>
  function replaceName() {
    document.querySelectorAll("*").forEach(el => {
      if (el.children.length === 0 && el.textContent.includes("Shambhavi Rai")) {
        el.textContent = el.textContent.replaceAll(
          "Shambhavi Rai",
          "Amrita Rai"
        );
      }
    });
  }

  // Run once
  replaceName();

  // Watch for React re-renders
  const observer = new MutationObserver(() => {
    replaceName();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
</script>

</body>
